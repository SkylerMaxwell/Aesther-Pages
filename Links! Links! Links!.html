<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090712" />
  <meta name="description" content="Aesther — links across the astral web." />
  <title>Aesther ✦ Astral Links</title>

  <style>
    :root {
      --bg: #06040c;
      --bg-2: #0d0819;
      --text: #f7f4ff;
      --muted: #b9aecf;
      --line: rgba(255,255,255,.12);
      --glass: rgba(15, 10, 28, .58);
      --lavender: #b79cff;
      --violet: #7d5cff;
      --cyan: #83e9ff;
      --pink: #ff9ee8;
      --shadow: 0 24px 90px rgba(0,0,0,.48);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 16%, rgba(125,92,255,.20), transparent 30%),
        radial-gradient(circle at 82% 8%, rgba(131,233,255,.10), transparent 25%),
        radial-gradient(circle at 65% 80%, rgba(255,158,232,.10), transparent 32%),
        linear-gradient(180deg, var(--bg-2), var(--bg));
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(183,156,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(131,233,255,.7) 0 1px, transparent 1.5px);
      background-size: 137px 137px, 211px 211px, 293px 293px;
      background-position: 0 0, 35px 60px, 100px 20px;
      opacity: .34;
      animation: drift 32s linear infinite;
      mask-image: linear-gradient(to bottom, black 0%, black 75%, transparent 100%);
    }

    .nebula {
      position: fixed;
      width: 48vw;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .14;
      pointer-events: none;
      animation: float 12s ease-in-out infinite alternate;
    }

    .nebula.one { background: #7d5cff; left: -18vw; top: 12vh; }
    .nebula.two { background: #4ad8ff; right: -22vw; bottom: 0; animation-delay: -5s; }

    main {
      position: relative;
      width: min(100%, 560px);
      z-index: 1;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.015)),
        var(--glass);
      backdrop-filter: blur(24px) saturate(130%);
      -webkit-backdrop-filter: blur(24px) saturate(130%);
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(183,156,255,.5), transparent 28%, transparent 72%, rgba(131,233,255,.28));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .sigil {
      width: 74px;
      height: 74px;
      margin-bottom: 18px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,.32), transparent 18%),
        linear-gradient(145deg, rgba(183,156,255,.22), rgba(131,233,255,.08));
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: inset 0 0 26px rgba(183,156,255,.08), 0 12px 40px rgba(77,51,140,.26);
      font-size: 34px;
      transform: rotate(-4deg);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--lavender);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 3.9rem);
      line-height: .96;
      letter-spacing: -.05em;
      font-weight: 780;
    }

    .gradient-text {
      background: linear-gradient(90deg, #fff 0%, #d8ccff 45%, #aeefff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .bio {
      margin: 15px 0 28px;
      max-width: 42ch;
      color: var(--muted);
      line-height: 1.65;
      font-size: .98rem;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      --accent: var(--lavender);
      position: relative;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 13px;
      min-height: 68px;
      padding: 11px 16px 11px 12px;
      color: var(--text);
      text-decoration: none;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.035);
      transition: transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
      isolation: isolate;
    }

    .link::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 13%, transparent), transparent 55%);
      opacity: 0;
      transition: opacity .22s ease;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 45%, rgba(255,255,255,.1));
      background: rgba(255,255,255,.055);
      box-shadow: 0 12px 30px rgba(0,0,0,.24);
      outline: none;
    }

    .link:hover::before,
    .link:focus-visible::before { opacity: 1; }

    .icon-wrap {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--accent);
    }

    .icon-wrap svg { width: 21px; height: 21px; fill: currentColor; }

    .label { min-width: 0; }
    .label strong { display: block; font-size: .98rem; font-weight: 700; }
    .label span {
      display: block;
      margin-top: 3px;
      font-size: .78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      color: color-mix(in srgb, var(--accent) 75%, white);
      font-size: 1.15rem;
      transition: transform .2s ease;
    }

    .link:hover .arrow { transform: translate(2px, -2px); }

    .x { --accent: #d8ccff; }
    .youtube { --accent: #ff92aa; }
    .github { --accent: #83e9ff; }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #8f84a7;
      font-size: .72rem;
      letter-spacing: .04em;
    }

    .sparkle {
      color: var(--lavender);
      filter: drop-shadow(0 0 8px rgba(183,156,255,.7));
    }

    @keyframes drift {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(-70px, 52px, 0); }
    }

    @keyframes float {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(35px,-26px,0) scale(1.08); }
    }

    @media (max-width: 520px) {
      body { padding: 18px 12px; }
      .card { padding: 25px 18px 20px; border-radius: 24px; }
      .bio { font-size: .93rem; }
      footer { align-items: flex-start; flex-direction: column; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="nebula one" aria-hidden="true"></div>
  <div class="nebula two" aria-hidden="true"></div>

  <main>

    <section class="card" aria-labelledby="site-title">
      <div class="sigil" aria-hidden="true">✦</div>

      <p class="eyebrow">My Links</p>
      <h1 id="site-title" class="gradient-text">Aesther</h1>
      <p class="bio">I <3 Neural Networks</p>

      <nav class="links" aria-label="Aesther's links">
        <a class="link x" href="https://x.com/AestherML" target="_blank" rel="noopener noreferrer">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/></svg>
          </span>
          <span class="label">
            <strong>X / Twitter</strong>
            <span>@AestherML</span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a class="link youtube" href="https://www.youtube.com/@AestherQKV" target="_blank" rel="noopener noreferrer">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.121-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814ZM9.545 15.568V8.432L15.818 12l-6.273 3.568Z"/></svg>
          </span>
          <span class="label">
            <strong>YouTube</strong>
            <span>@AestherQKV</span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a class="link github" href="https://github.com/SkylerMaxwell" target="_blank" rel="noopener noreferrer">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 .7a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.23c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23A11.5 11.5 0 0 1 12 6.5c1.02 0 2.05.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.3c0 .32.22.7.82.58A12 12 0 0 0 12 .7Z"/></svg>
          </span>
          <span class="label">
            <strong>GitHub</strong>
            <span>SkylerMaxwell</span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>

      <footer>
        <span><span class="sparkle">✦</span> Aesther [ ]</span>
        <span id="coords">RA 00h 00m · DEC +00° 00′</span>
      </footer>
    </section>
  </main>

  <script>
    // Tiny atmospheric detail: coordinates subtly shift with pointer position.
    const coords = document.getElementById('coords');
    window.addEventListener('pointermove', (event) => {
      const ra = ((event.clientX / window.innerWidth) * 24).toFixed(1).padStart(4, '0');
      const dec = (((event.clientY / window.innerHeight) * 180) - 90).toFixed(1);
      coords.textContent = `RA ${ra}h · DEC ${dec > 0 ? '+' : ''}${dec}°`;
    }, { passive: true });
  </script>
</body>
</html>
